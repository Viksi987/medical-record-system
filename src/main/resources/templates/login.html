<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body>

<div class="container mt-5"
     style="max-width: 500px;">

    <h1 class="mb-4 text-center">
        Login
    </h1>

    <form method="post"
          action="/login">

        <div class="mb-3">

            <label>Username</label>

            <input type="text"
                   name="username"
                   class="form-control"
                   required>

        </div>

        <div class="mb-3">

            <label>Password</label>

            <input type="password"
                   name="password"
                   class="form-control"
                   required>

        </div>

        <button type="submit"
                class="btn btn-dark w-100">

            Login
        </button>

    </form>

    <div class="text-center mt-3">

        <a href="/register">
            Register
        </a>

    </div>

</div>

</body>
</html>
