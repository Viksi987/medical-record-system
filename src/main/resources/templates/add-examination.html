<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Add Examination</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container mt-5">

    <h1 class="mb-4">Add Examination</h1>

    <form action="/save-examination"
          method="post">

        <div class="mb-3">

            <label class="form-label">Date</label>

            <input type="date"
                   name="examinationDate"
                   class="form-control"
                   required>

        </div>

        <div class="mb-3">

            <label class="form-label">Diagnosis</label>

            <input type="text"
                   name="diagnosis"
                   class="form-control"
                   required>

        </div>

        <div class="mb-3">

            <label class="form-label">Treatment</label>

            <input type="text"
                   name="treatment"
                   class="form-control"
                   required>

        </div>

        <div class="mb-3">

            <label class="form-label">Price</label>

            <input type="number"
                   step="0.01"
                   name="price"
                   class="form-control"
                   required>

        </div>

        <div class="mb-3">

            <label class="form-label">Patient ID</label>

            <input type="number"
                   name="patient.id"
                   class="form-control"
                   required>

        </div>

        <div class="mb-3">

            <label class="form-label">Doctor ID</label>

            <input type="number"
                   name="doctor.id"
                   class="form-control"
                   required>

        </div>

        <button type="submit"
                class="btn btn-success">

            Save Examination
        </button>

    </form>

</div>

</body>
</html>
