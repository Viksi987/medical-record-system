<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container mt-5">

    <h1 class="mb-5">
        Medical Record System Dashboard
    </h1>

    <div class="row g-4">

        <div class="col-md-4">

            <div class="card text-bg-primary shadow">

                <div class="card-body">

                    <h3 th:text="${patientsCount}"></h3>

                    <p>Total Patients</p>

                </div>

            </div>

        </div>

        <div class="col-md-4">

            <div class="card text-bg-success shadow">

                <div class="card-body">

                    <h3 th:text="${doctorsCount}"></h3>

                    <p>Total Doctors</p>

                </div>

            </div>

        </div>

        <div class="col-md-4">

            <div class="card text-bg-dark shadow">

                <div class="card-body">

                    <h3 th:text="${examinationsCount}"></h3>

                    <p>Total Examinations</p>

                </div>

            </div>

        </div>

    </div>

    <div class="row g-4 mt-3">

        <div class="col-md-6">

            <div class="card shadow">

                <div class="card-body">

                    <h4>Most Common Diagnosis</h4>

                    <h2 class="text-danger"
                        th:text="${mostCommonDiagnosis}">
                    </h2>

                </div>

            </div>

        </div>

        <div class="col-md-6">

            <div class="card shadow">

                <div class="card-body">

                    <h4>Total Revenue</h4>

                    <h2 class="text-success"
                        th:text="${totalRevenue}">
                    </h2>

                </div>

            </div>

        </div>

    </div>

</div>
<div class="row mt-4">

    <div class="col-md-4">

        <div class="card shadow border-0 bg-primary text-white">

            <div class="card-body">

                <h5>Flu Cases</h5>

                <h2 th:text="${fluCount}"></h2>

            </div>

        </div>

    </div>

    <div class="col-md-4">

        <div class="card shadow border-0 bg-danger text-white">

            <div class="card-body">

                <h5>COVID Cases</h5>

                <h2 th:text="${covidCount}"></h2>

            </div>

        </div>

    </div>

    <div class="col-md-4">

        <div class="card shadow border-0 bg-warning text-dark">

            <div class="card-body">

                <h5>Diabetes Cases</h5>

                <h2 th:text="${diabetesCount}"></h2>

            </div>

        </div>

    </div>

</div>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<div class="row mt-5">

    <div class="col-md-6">

        <canvas id="diagnosisChart"></canvas>

    </div>

    <div class="col-md-6">

        <canvas id="systemChart"></canvas>

    </div>

</div>

<script>

    const diagnosisCtx =
        document.getElementById('diagnosisChart');

    new Chart(diagnosisCtx, {

        type: 'bar',

        data: {

            labels: ['Flu', 'COVID', 'Diabetes'],

            datasets: [{

                label: 'Cases',

                data: [
                    [[${fluCount}]],
                    [[${covidCount}]],
                    [[${diabetesCount}]]
                ],

                backgroundColor: [
                    '#0d6efd',
                    '#dc3545',
                    '#ffc107'
                ]

            }]
        }
    });

    const systemCtx =
        document.getElementById('systemChart');

    new Chart(systemCtx, {

        type: 'pie',

        data: {

            labels: [
                'Patients',
                'Doctors',
                'Examinations'
            ],

            datasets: [{

                data: [
                    [[${patientsCount}]],
                    [[${doctorsCount}]],
                    [[${examinationsCount}]]
                ],

                backgroundColor: [
                    '#0d6efd',
                    '#198754',
                    '#212529'
                ]

            }]
        }
    });

</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
