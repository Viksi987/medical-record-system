<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Edit Sick Leave</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container mt-5">

    <h1>Edit Sick Leave</h1>

    <form action="/update-sick-leave"
          method="post"
          th:object="${sickLeave}">

        <input type="hidden"
               th:field="*{id}">

        <div class="mb-3">

            <label>Start Date</label>

            <input type="date"
                   th:field="*{startDate}"
                   class="form-control">

        </div>

        <div class="mb-3">

            <label>Days</label>

            <input type="number"
                   th:field="*{days}"
                   class="form-control">

        </div>

        <button type="submit"
                class="btn btn-success">

            Update Sick Leave
        </button>

    </form>

</div>

</body>
</html>
