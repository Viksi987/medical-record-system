<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Revenue By Doctor</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container mt-5">

    <h2 class="mb-4">
        Revenue By Doctor
    </h2>

    <form action="/revenue-by-doctor"
          method="get"
          class="mb-4">

        <div class="row">

            <div class="col-md-6">

                <select name="doctorId"
                        class="form-control">

                    <option value="">
                        Select Doctor
                    </option>

                    <option th:each="doctor : ${doctors}"
                            th:value="${doctor.id}"
                            th:text="${doctor.fullName}">
                    </option>

                </select>

            </div>

            <div class="col-md-2">

                <button type="submit"
                        class="btn btn-primary">

                    Search
                </button>

            </div>

        </div>

    </form>

    <div th:if="${revenue != null}"
         class="alert alert-success">

        <h4>

            Total Revenue for
            <span th:text="${selectedDoctor.fullName}"></span>

            :

            <span th:text="${revenue}"></span>
            lv.

        </h4>

    </div>

</div>

</body>
</html>
