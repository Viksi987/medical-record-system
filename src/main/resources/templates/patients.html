<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Patients</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container mt-5">

    <h2 class="mb-4">Patients</h2>

    <table class="table table-striped table-bordered table-hover">

        <thead class="table-dark">

        <tr>

            <th>ID</th>

            <th>Full Name</th>

            <th>EGN</th>

            <th>Insured</th>

            <th>Doctor</th>

            <th>Actions</th>

        </tr>

        </thead>

        <tbody>

        <tr th:each="patient : ${patients}">

            <td th:text="${patient.id}"></td>

            <td th:text="${patient.fullName}"></td>

            <td th:text="${patient.egn}"></td>

            <td th:text="${patient.insured}"></td>

            <td th:text="${patient.personalDoctor != null
                          ? patient.personalDoctor.fullName
                          : 'No Doctor'}"></td>

            <td>

                <a th:href="@{/patient-history/{id}(id=${patient.id})}"
                   class="btn btn-info btn-sm">

                    History
                </a>

                <a th:href="@{/edit-patient/{id}(id=${patient.id})}"
                   class="btn btn-warning btn-sm">

                    Edit
                </a>

                <a th:href="@{/delete-patient/{id}(id=${patient.id})}"
                   class="btn btn-danger btn-sm"
                   onclick="return confirm('Are you sure?')">

                    Delete
                </a>

            </td>

        </tr>

        </tbody>

    </table>

    <a href="/add-patient"
       class="btn btn-primary mt-3">

        Add New Patient
    </a>

</div>

</body>

</html>
