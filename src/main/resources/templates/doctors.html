<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Doctors</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container mt-5">

    <h1 class="mb-4">Doctors</h1>

    <table class="table table-bordered table-striped">

        <thead class="table-dark">

        <tr>

            <th>ID</th>

            <th>Full Name</th>

            <th>Specialty</th>

            <th>Personal Doctor</th>

            <th>Actions</th>

        </tr>

        </thead>

        <tbody>

        <tr th:each="doctor : ${doctors}">

            <td th:text="${doctor.id}"></td>

            <td th:text="${doctor.fullName}"></td>

            <td th:text="${doctor.specialty}"></td>

            <td th:text="${doctor.canBePersonalDoctor ? 'YES' : 'NO'}"></td>

            <td>

                <a th:href="@{'/edit-doctor/' + ${doctor.id}}"
                   class="btn btn-warning btn-sm">

                    Edit
                </a>

                <a th:href="@{'/delete-doctor/' + ${doctor.id}}"
                   class="btn btn-danger btn-sm"
                   onclick="return confirm('Are you sure?')">

                    Delete
                </a>

            </td>

        </tr>

        </tbody>

    </table>

</div>

</body>
</html>
