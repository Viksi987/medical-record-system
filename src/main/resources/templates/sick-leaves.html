<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Sick Leaves</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container mt-5">

    <h2 class="mb-4">
        Sick Leaves
    </h2>

    <a href="/add-sick-leave"
       class="btn btn-primary mb-3">

        Add Sick Leave
    </a>

    <table class="table table-striped table-bordered">

        <thead class="table-dark">

        <tr>

            <th>ID</th>

            <th>Patient</th>

            <th>Start Date</th>

            <th>Days</th>

            <th>Actions</th>

        </tr>

        </thead>

        <tbody>

        <tr th:each="leave : ${sickLeaves}">

            <td th:text="${leave.id}"></td>

            <td th:text="${leave.patient.fullName}"></td>

            <td th:text="${leave.startDate}"></td>

            <td th:text="${leave.days}"></td>

            <td>

                <a th:href="@{'/edit-sick-leave/' + ${leave.id}}"
                   class="btn btn-warning btn-sm">

                    Edit
                </a>

                <a th:href="@{'/delete-sick-leave/' + ${leave.id}}"
                   class="btn btn-danger btn-sm"
                   onclick="return confirm('Are you sure?')">

                    Delete
                </a>

            </td>

        </tr>

        </tbody>

    </table>

</div>

</body>

</html>
