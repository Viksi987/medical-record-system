<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Edit Doctor</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container mt-5">

    <h1>Edit Doctor</h1>

    <form action="/update-doctor"
          method="post"
          th:object="${doctor}">

        <input type="hidden"
               th:field="*{id}">

        <div class="mb-3">

            <label>Full Name</label>

            <input type="text"
                   th:field="*{fullName}"
                   class="form-control">
        </div>

        <div class="mb-3">

            <label>Specialty</label>

            <input type="text"
                   th:field="*{specialty}"
                   class="form-control">
        </div>

        <div class="form-check mb-3">

            <input type="checkbox"
                   th:field="*{canBePersonalDoctor}"
                   class="form-check-input">

            <label class="form-check-label">
                Can Be Personal Doctor
            </label>

        </div>

        <button type="submit"
                class="btn btn-success">

            Update
        </button>

    </form>

</div>

</body>
</html>
