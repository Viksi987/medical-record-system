<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Add Sick Leave</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container mt-5">

    <h2>Add Sick Leave</h2>

    <form th:action="@{/save-sick-leave}"
          th:object="${sickLeave}"
          method="post">

        <div class="mb-3">

            <label class="form-label">
                Patient
            </label>

            <select th:field="*{patient}"
                    class="form-control">

                <option th:each="patient : ${patients}"
                        th:value="${patient.id}"
                        th:text="${patient.fullName}">
                </option>

            </select>

        </div>

        <div class="mb-3">

            <label class="form-label">
                Start Date
            </label>

            <input type="date"
                   th:field="*{startDate}"
                   class="form-control">

        </div>

        <div class="mb-3">

            <label class="form-label">
                Days
            </label>

            <input type="number"
                   th:field="*{days}"
                   class="form-control">

        </div>

        <button type="submit"
                class="btn btn-success">

            Save
        </button>

    </form>

</div>

</body>
</html>
