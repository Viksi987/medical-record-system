<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Edit Examination</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container mt-5">

    <h1>Edit Examination</h1>

    <form action="/update-examination"
          method="post"
          th:object="${examination}">

        <input type="hidden"
               th:field="*{id}">

        <div class="mb-3">

            <label>Date</label>

            <input type="date"
                   th:field="*{examinationDate}"
                   class="form-control">

        </div>

        <div class="mb-3">

            <label>Diagnosis</label>

            <input type="text"
                   th:field="*{diagnosis}"
                   class="form-control">

        </div>

        <div class="mb-3">

            <label>Treatment</label>

            <input type="text"
                   th:field="*{treatment}"
                   class="form-control">

        </div>

        <div class="mb-3">

            <label>Price</label>

            <input type="number"
                   step="0.01"
                   th:field="*{price}"
                   class="form-control">

        </div>

        <button type="submit"
                class="btn btn-success">

            Update Examination
        </button>

    </form>

</div>

</body>
</html>
