<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Patients By Doctor</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container mt-5">

    <h2 class="mb-4">
        Patients By Doctor
    </h2>

    <form action="/patients-by-doctor"
          method="get"
          class="mb-4">

        <div class="row">

            <div class="col-md-6">

                <select name="doctorId"
                        class="form-control">

                    <option value="">
                        Select Doctor
                    </option>

                    <option th:each="doctor : ${doctors}"
                            th:value="${doctor.id}"
                            th:text="${doctor.fullName}">
                    </option>

                </select>

            </div>

            <div class="col-md-2">

                <button type="submit"
                        class="btn btn-primary">

                    Search
                </button>

            </div>

        </div>

    </form>

    <table class="table table-bordered">

        <thead class="table-dark">

        <tr>

            <th>ID</th>
            <th>Full Name</th>
            <th>EGN</th>
            <th>Insured</th>

        </tr>

        </thead>

        <tbody>

        <tr th:each="patient : ${patients}">

            <td th:text="${patient.id}"></td>

            <td th:text="${patient.fullName}"></td>

            <td th:text="${patient.egn}"></td>

            <td th:text="${patient.insured}"></td>

        </tr>

        </tbody>

    </table>

</div>

</body>
</html>
