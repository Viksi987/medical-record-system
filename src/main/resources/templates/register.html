<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Register</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body>

<div class="container mt-5"
     style="max-width: 500px;">

    <h1 class="mb-4 text-center">
        Register
    </h1>

    <form action="/save-user"
          method="post"
          th:object="${user}">

        <div class="mb-3">

            <label>Username</label>

            <input type="text"
                   th:field="*{username}"
                   class="form-control">

        </div>

        <div class="mb-3">

            <label>Password</label>

            <input type="password"
                   th:field="*{password}"
                   class="form-control">

        </div>

        <div class="mb-3">

            <label class="form-label">
                Role
            </label>

            <select th:field="*{role}"
                    class="form-control"
                    id="roleSelect">

                <option value="PATIENT">
                    PATIENT
                </option>

                <option value="DOCTOR">
                    DOCTOR
                </option>

                <option value="ADMIN">
                    ADMIN
                </option>

            </select>

        </div>

        <!-- PATIENT ONLY FIELDS -->

        <div id="patientFields">

            <div class="mb-3">

                <label>Full Name</label>

                <input type="text"
                       name="fullName"
                       class="form-control">

            </div>

            <div class="mb-3">

                <label>EGN</label>

                <input type="text"
                       name="egn"
                       class="form-control">

            </div>

            <div class="mb-3 form-check">

                <input type="checkbox"
                       name="insured"
                       class="form-check-input">

                <label class="form-check-label">
                    Insured
                </label>

            </div>

            <div class="mb-3">

                <label>Personal Doctor</label>

                <select name="doctorId"
                        class="form-control">

                    <option th:each="doctor : ${doctors}"
                            th:value="${doctor.id}"
                            th:text="${doctor.fullName}">
                    </option>

                </select>

            </div>

        </div>

        <button type="submit"
                class="btn btn-success w-100">

            Register
        </button>

    </form>

</div>

<script>

    const roleSelect =
        document.getElementById("roleSelect");

    const patientFields =
        document.getElementById("patientFields");

    function togglePatientFields() {

        if (roleSelect.value === "PATIENT") {

            patientFields.style.display = "block";

        } else {

            patientFields.style.display = "none";
        }
    }

    togglePatientFields();

    roleSelect.addEventListener(
        "change",
        togglePatientFields
    );

</script>

</body>
</html>
