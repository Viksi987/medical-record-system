<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Patient History</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container mt-5">

    <h2 class="mb-4">
        Patient Medical History
    </h2>

    <div class="alert alert-info mb-4">

        <strong>Personal Doctor:</strong>

        <span th:if="${patient.personalDoctor != null}"
              th:text="${patient.personalDoctor.fullName}">
        </span>

        <span th:if="${patient.personalDoctor == null}">
            No personal doctor assigned
        </span>

    </div>

    <table class="table table-bordered table-striped">

        <thead class="table-dark">

        <tr>

            <th>Date</th>
            <th>Doctor</th>
            <th>Diagnosis</th>
            <th>Treatment</th>
            <th>Price</th>

        </tr>

        </thead>

        <tbody>

        <tr th:each="exam : ${examinations}">

            <td th:text="${exam.examinationDate}"></td>

            <td th:text="${exam.doctor.fullName}"></td>

            <td th:text="${exam.diagnosis}"></td>

            <td th:text="${exam.treatment}"></td>

            <td th:text="${exam.price}"></td>

        </tr>

        </tbody>

    </table>

</div>

</body>

</html>
