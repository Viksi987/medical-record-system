<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Filter Examinations</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container mt-5">

    <h2 class="mb-4">
        Filter Examinations
    </h2>

    <form action="/filter-examinations"
          method="get"
          class="row g-3 mb-4">

        <div class="col-md-4">

            <label class="form-label">
                Doctor
            </label>

            <select name="doctorId"
                    class="form-control">

                <option value="">
                    All
                </option>

                <option th:each="doctor : ${doctors}"
                        th:value="${doctor.id}"
                        th:text="${doctor.fullName}">
                </option>

            </select>

        </div>

        <div class="col-md-3">

            <label class="form-label">
                Start Date
            </label>

            <input type="date"
                   name="startDate"
                   class="form-control">

        </div>

        <div class="col-md-3">

            <label class="form-label">
                End Date
            </label>

            <input type="date"
                   name="endDate"
                   class="form-control">

        </div>

        <div class="col-md-2 d-flex align-items-end">

            <button type="submit"
                    class="btn btn-primary w-100">

                Filter
            </button>

        </div>

    </form>

    <table class="table table-bordered table-striped">

        <thead class="table-dark">

        <tr>

            <th>Date</th>
            <th>Doctor</th>
            <th>Patient</th>
            <th>Diagnosis</th>
            <th>Treatment</th>
            <th>Price</th>

        </tr>

        </thead>

        <tbody>

        <tr th:each="exam : ${examinations}">

            <td th:text="${exam.examinationDate}"></td>

            <td th:text="${exam.doctor.fullName}"></td>

            <td th:text="${exam.patient.fullName}"></td>

            <td th:text="${exam.diagnosis}"></td>

            <td th:text="${exam.treatment}"></td>

            <td th:text="${exam.price}"></td>

        </tr>

        </tbody>

    </table>

</div>

</body>
</html>
