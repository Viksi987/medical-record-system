<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Examinations</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container mt-5">

    <h1 class="mb-4">Examinations</h1>

    <table class="table table-bordered table-striped">

        <thead class="table-dark">

        <tr>

            <th>ID</th>
            <th>Diagnosis</th>
            <th>Treatment</th>
            <th>Price</th>
            <th>Date</th>
            <th>Actions</th>

        </tr>

        </thead>

        <tbody>

        <tr th:each="exam : ${examinations}">

            <td th:text="${exam.id}"></td>

            <td th:text="${exam.diagnosis}"></td>

            <td th:text="${exam.treatment}"></td>

            <td th:text="${exam.price}"></td>

            <td th:text="${exam.examinationDate}"></td>

            <td>

                <a th:href="@{'/edit-examination/' + ${exam.id}}"
                   class="btn btn-warning btn-sm">

                    Edit
                </a>

                <a th:href="@{'/delete-examination/' + ${exam.id}}"
                   class="btn btn-danger btn-sm"
                   onclick="return confirm('Are you sure?')">

                    Delete
                </a>

            </td>

        </tr>

        </tbody>

    </table>

</div>

</body>
</html>
