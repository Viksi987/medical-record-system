<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Add Doctor</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container mt-5">

    <h1 class="mb-4">Add Doctor</h1>

    <form action="/save-doctor"
          method="post"
          th:object="${doctor}">

        <div class="mb-3">

            <label class="form-label">
                Full Name
            </label>

            <input type="text"
                   th:field="*{fullName}"
                   class="form-control"
                   required>

        </div>

        <div class="mb-3">

            <label class="form-label">
                Specialty
            </label>

            <input type="text"
                   th:field="*{specialty}"
                   class="form-control"
                   required>

        </div>

        <div class="form-check mb-4">

            <input class="form-check-input"
                   type="checkbox"
                   th:field="*{canBePersonalDoctor}">

            <label class="form-check-label">
                Can be personal doctor
            </label>

        </div>

        <button type="submit"
                class="btn btn-success">

            Save
        </button>

    </form>

</div>

</body>
</html>
