<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Edit Patient</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container mt-5">

    <h1 class="mb-4">Edit Patient</h1>

    <form th:action="@{/update-patient}"
          th:object="${patient}"
          method="post">

        <input type="hidden"
               th:field="*{id}">

        <div class="mb-3">

            <label class="form-label">
                Full Name
            </label>

            <input type="text"
                   th:field="*{fullName}"
                   class="form-control">

        </div>

        <div class="mb-3">

            <label class="form-label">
                EGN
            </label>

            <input type="text"
                   th:field="*{egn}"
                   class="form-control">

        </div>

        <div class="mb-3 form-check">

            <input type="checkbox"
                   th:field="*{insured}"
                   class="form-check-input">

            <label class="form-check-label">
                Insured
            </label>

        </div>

        <button type="submit"
                class="btn btn-success">

            Update Patient
        </button>

    </form>

</div>

</body>
</html>
